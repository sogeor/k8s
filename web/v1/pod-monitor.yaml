apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: web-v1
  namespace: web
spec:
  podMetricsEndpoints:
    - interval: 15s
      scrapeTimeout: 10s
      path: /actuator/prometheus
      port: http-management
  selector:
    matchLabels:
      app.kubernetes.io/name: web-service
      app.kubernetes.io/version: v1
